openapi: 3.0.0
info:
  title: LCMS API
  description: Tài liệu API cho hệ thống Quản lý Trung tâm Học tập (LCMS)
  version: 2.0.0

servers:
  - url: http://localhost:3003/api/v1
    description: Local Development Server

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Xác thực và quản lý phiên đăng nhập
  - name: Branch
    description: Quản lý cơ sở
  - name: User
    description: Quản lý người dùng (nhân viên, giáo viên)
  - name: Teacher
    description: Quản lý giáo viên
  - name: Parent
    description: Quản lý phụ huynh
  - name: Student
    description: Quản lý học sinh
  - name: Class
    description: Quản lý lớp học
  - name: Enrollment
    description: Quản lý đăng ký học
  - name: ClassSession
    description: Quản lý buổi học
  - name: Attendance
    description: Điểm danh
  - name: Assignment
    description: Bài tập và nộp bài
  - name: GradeRecord
    description: Học bạ và điểm số
  - name: Finance
    description: Quản lý học phí và hóa đơn
  - name: Notification
    description: Thông báo hệ thống
  - name: Message
    description: Tin nhắn nội bộ
  - name: Report
    description: Báo cáo và thống kê
  - name: ClassAnnouncement
    description: Thông báo lớp học

paths:

  # ── Auth (Module 0) ───────────────────────────────────────────

  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập (0.1)
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponseData'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Làm mới Access Token (0.2)
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Làm mới token thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResponseData'
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất (0.3)
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/change-password:
    patch:
      tags: [Auth]
      summary: Đổi mật khẩu (0.4)
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Đổi mật khẩu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/reset-password/{userId}:
    post:
      tags: [Auth]
      summary: Reset mật khẩu người dùng — SO/BO (0.5)
      operationId: resetPassword
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Reset mật khẩu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  # ── Branch (Module 1) ─────────────────────────────────────────

  /branch/create-branch:
    post:
      tags: [Branch]
      summary: Tạo cơ sở mới — SO (1.1)
      operationId: createBranch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '201':
          description: Tạo cơ sở thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Branch'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /branch/all:
    get:
      tags: [Branch]
      summary: Danh sách cơ sở (1.2)
      operationId: getAllBranches
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Danh sách cơ sở
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Branch'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'

  /branch/my-overview:
    get:
      tags: [Branch]
      summary: Tổng quan cơ sở hiện tại — BO/STAFF (1.2a)
      description: Lấy các thông tin tổng quan cho cơ sở gắn với tài khoản đang đăng nhập, dùng cho màn hình sau đăng nhập của chủ cơ sở hoặc nhân viên.
      operationId: getMyBranchOverview
      responses:
        '200':
          description: Tổng quan cơ sở hiện tại
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BranchOverview'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /branch/{id}/overview:
    get:
      tags: [Branch]
      summary: Tổng quan cơ sở — SO/BO/STAFF (1.2b)
      operationId: getBranchOverview
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Tổng quan cơ sở
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BranchOverview'
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /branch/{id}:
    get:
      tags: [Branch]
      summary: Chi tiết cơ sở (1.3)
      operationId: getBranchById
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Chi tiết cơ sở
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Branch'
        '404': { $ref: '#/components/responses/NotFoundError' }

    patch:
      tags: [Branch]
      summary: Cập nhật cơ sở — SO (1.4)
      operationId: updateBranch
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBranchRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Branch'
        '404': { $ref: '#/components/responses/NotFoundError' }

  /branch/{id}/toggle-active:
    patch:
      tags: [Branch]
      summary: Kích hoạt / vô hiệu hóa cơ sở — SO (1.5)
      operationId: toggleBranchActive
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Thay đổi trạng thái thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404': { $ref: '#/components/responses/NotFoundError' }

  # ── User (Module 2) ───────────────────────────────────────────

  /user/create-user:
    post:
      tags: [User]
      summary: Tạo người dùng — SO/BO/STAFF (2.1)
      description: |
        Quyền tạo theo vai trò:
        - **SO**: tạo mọi role
        - **BO**: tạo STAFF, TEACHER, STUDENT, PARENT (tự động gán branchId)
        - **STAFF**: tạo STUDENT, PARENT (tự động gán branchId)
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Tạo người dùng thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /user/all:
    get:
      tags: [User]
      summary: Danh sách người dùng (2.2)
      operationId: getAllUsers
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: search
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema:
            type: string
            enum: [SYSTEM_OWNER, BRANCH_OWNER, STAFF, TEACHER, STUDENT, PARENT]
      responses:
        '200':
          description: Danh sách người dùng
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'

  /user/{id}:
    get:
      tags: [User]
      summary: Chi tiết người dùng (2.3)
      operationId: getUserById
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Chi tiết người dùng
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '404': { $ref: '#/components/responses/NotFoundError' }

    patch:
      tags: [User]
      summary: Cập nhật người dùng (2.4)
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '404': { $ref: '#/components/responses/NotFoundError' }

  /user/{id}/deactivate:
    patch:
      tags: [User]
      summary: Vô hiệu hóa tài khoản — SO/BO (2.5)
      operationId: deactivateUser
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Vô hiệu hóa thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404': { $ref: '#/components/responses/NotFoundError' }

  # ── Teacher (Module T) ───────────────────────────────────────

  /teachers/my-overview:
    get:
      tags: [Teacher]
      summary: Tổng quan giáo viên hiện tại — TEACHER (T.0)
      description: |
        Lấy tổng quan dành cho giáo viên đang đăng nhập: lớp phụ trách, lịch dạy, điểm danh cần xử lý, bài tập, bài nộp chờ chấm và thông báo.
      operationId: getMyTeacherOverview
      responses:
        '200':
          description: Tổng quan giáo viên
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TeacherOverview'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /teachers:
    post:
      tags: [Teacher]
      summary: Tạo giáo viên mới — BO/STAFF (T.1)
      operationId: createTeacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeacherRequest'
      responses:
        '201':
          description: Tạo giáo viên thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Teacher'
        '409': { $ref: '#/components/responses/ConflictError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Teacher]
      summary: Danh sách giáo viên — BO/STAFF (T.2)
      operationId: getTeachers
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: search
          in: query
          description: Tìm kiếm theo tên
          schema: { type: string }
        - name: isActive
          in: query
          schema: { type: string, enum: ['true', 'false'] }
        - name: subject
          in: query
          description: Lọc theo môn học
          schema: { type: string }
      responses:
        '200':
          description: Danh sách giáo viên
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Teacher'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'

  /teachers/{id}:
    get:
      tags: [Teacher]
      summary: Chi tiết giáo viên — BO/STAFF (T.3)
      operationId: getTeacherById
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Chi tiết giáo viên
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Teacher'
        '404': { $ref: '#/components/responses/NotFoundError' }
    patch:
      tags: [Teacher]
      summary: Cập nhật giáo viên — BO/STAFF (T.4)
      operationId: updateTeacher
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeacherRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Teacher'
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [Teacher]
      summary: Xóa mềm giáo viên — BO/STAFF (T.5)
      operationId: deleteTeacher
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Xóa thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean }
                          teacherId: { type: string }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  # ── Parent (Module P) ────────────────────────────────────────

  /parents/my-overview:
    get:
      tags: [Parent]
      summary: Tổng quan phụ huynh hiện tại — PARENT (P.0)
      description: |
        Lấy tổng quan dành cho phụ huynh đang đăng nhập: danh sách con, lịch học, bài tập hiển thị cho phụ huynh, điểm mới, học phí và thông báo.
      operationId: getMyParentOverview
      responses:
        '200':
          description: Tổng quan phụ huynh
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ParentOverview'
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /parents:
    post:
      tags: [Parent]
      summary: Tạo phụ huynh mới — BO/STAFF (P.1)
      operationId: createParent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateParentRequest'
      responses:
        '201':
          description: Tạo phụ huynh thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Parent'
        '409': { $ref: '#/components/responses/ConflictError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Parent]
      summary: Danh sách phụ huynh — BO/STAFF (P.2)
      operationId: getParents
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: search
          in: query
          description: Tìm kiếm theo tên phụ huynh
          schema: { type: string }
        - name: isActive
          in: query
          schema: { type: string, enum: ['true', 'false'] }
        - name: studentId
          in: query
          description: Lọc theo học sinh liên kết
          schema: { type: string }
        - name: relationship
          in: query
          schema:
            type: string
            enum: [father, mother, guardian, other]
      responses:
        '200':
          description: Danh sách phụ huynh
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Parent'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'

  /parents/{id}:
    get:
      tags: [Parent]
      summary: Chi tiết phụ huynh — BO/STAFF (P.3)
      operationId: getParentById
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Chi tiết phụ huynh
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Parent'
        '404': { $ref: '#/components/responses/NotFoundError' }
    patch:
      tags: [Parent]
      summary: Cập nhật phụ huynh — BO/STAFF (P.4)
      operationId: updateParent
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateParentRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Parent'
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
    delete:
      tags: [Parent]
      summary: Xóa mềm phụ huynh — BO/STAFF (P.5)
      operationId: deleteParent
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Xóa thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean }
                          parentId: { type: string }
        '404': { $ref: '#/components/responses/NotFoundError' }

  # ── Student (Module 3) ────────────────────────────────────────

  /student/my-overview:
    get:
      tags: [Student]
      summary: Tổng quan học sinh hiện tại — STUDENT (3.0)
      description: |
        Lấy tổng quan dành cho học sinh đang đăng nhập: lớp đang học, lịch học, điểm danh, bài tập, điểm, học phí và thông báo.
      operationId: getMyStudentOverview
      responses:
        '200':
          description: Tổng quan học sinh
          content:

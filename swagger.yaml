# ── Components ────────────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    classId:
      name: classId
      in: path
      required: true
      schema: { type: string }
    sessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }

  schemas:

    # ── Base ──────────────────────────────────────────────────────

    ApiResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "Thành công" }
        requestId: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }

    ApiErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: "Lỗi" }
        code: { type: string, example: "NOT_FOUND" }
        requestId: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
        details: { type: object }

    PaginationMeta:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        total_pages: { type: integer }

    # ── Auth ──────────────────────────────────────────────────────

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: "admin@lcms.vn" }
        password: { type: string, format: password, example: "Admin@123456" }

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    LoginResponseData:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: string }
            email: { type: string }
            role: { type: string }
            fullName: { type: string }
            branchId: { type: string, nullable: true }
        accessToken: { type: string }
        refreshToken: { type: string }

    TokenResponseData:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }

    # ── Branch ────────────────────────────────────────────────────

    Branch:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        code: { type: string }
        address: { type: string }
        phone: { type: string }
        email: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BranchOverview:
      type: object
      properties:
        branch_id: { type: string }
        branch_code: { type: string }
        name: { type: string }
        owner:
          type: object
          nullable: true
          properties:
            _id: { type: string }
            full_name: { type: string }
            email: { type: string, format: email }
            phone: { type: string }
            is_active: { type: boolean }
        contact:
          type: object
          properties:
            email: { type: string, format: email }
            phone: { type: string }
            address: { type: string }
        status:
          type: object
          properties:
            is_active: { type: boolean }
            deleted_at: { type: string, format: date-time, nullable: true }
        settings:
          type: object
          properties:
            timezone: { type: string }
            default_fee_per_session: { type: number }
            default_session_slots:
              type: array
              items:
                type: object
            rooms:
              type: array
              items:
                type: object
        member_summary:
          type: object
          properties:
            total_members: { type: integer }
            total_accounts: { type: integer }
            by_status:
              type: object
              properties:
                total: { type: integer }
                active: { type: integer }
                inactive: { type: integer }
                deleted: { type: integer }
            by_role:
              type: object
              additionalProperties:
                type: object
                properties:
                  total: { type: integer }
                  active: { type: integer }
                  inactive: { type: integer }
                  deleted: { type: integer }
        class_summary:
          type: object
          properties:
            total: { type: integer }
            by_status:
              type: object
              additionalProperties: { type: integer }
        finance_summary:
          type: object
          properties:
            revenue_this_month: { type: number }
            invoices_total: { type: integer }
            invoices_by_status:
              type: object
              additionalProperties: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        as_of: { type: string, format: date-time }

    CreateBranchRequest:
      type: object
      required: [name, code]
      properties:
        name: { type: string, example: "Cơ sở Hà Nội" }
        code: { type: string, example: "HN01" }
        address: { type: string }
        phone: { type: string }
        email: { type: string, format: email }

    UpdateBranchRequest:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        phone: { type: string }
        email: { type: string, format: email }

    # ── User ──────────────────────────────────────────────────────

    User:
      type: object
      properties:
        _id: { type: string }
        fullName: { type: string }
        email: { type: string }
        phone: { type: string }
        role:
          type: string
          enum: [SYSTEM_OWNER, BRANCH_OWNER, STAFF, TEACHER, STUDENT, PARENT]
        branchId: { type: string, nullable: true }
        userCode: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateUserRequest:
      type: object
      required: [full_name, email, role, password]
      properties:
        full_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        role:
          type: string
          enum: [BRANCH_OWNER, STAFF, TEACHER, STUDENT, PARENT]
          description: |
            SO: mọi role | BO: STAFF/TEACHER/STUDENT/PARENT | STAFF: STUDENT/PARENT
        branch_id:
          type: string
          description: Bắt buộc khi SO tạo tài khoản. BO/STAFF tự động dùng branchId của mình.
        password: { type: string, minLength: 6 }

    UpdateUserRequest:
      type: object
      properties:
        full_name: { type: string }
        phone: { type: string }
        email: { type: string, format: email }

    # ── Teacher ───────────────────────────────────────────────────

    TeacherInfo:
      type: object
      properties:
        subjects:
          type: array
          items: { type: string }
        joinDate: { type: string, format: date, nullable: true }
        activeClassIds:
          type: array
          items: { type: string }

    Teacher:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            teacherInfo:
              $ref: '#/components/schemas/TeacherInfo'

    TeacherOverview:
      type: object
      properties:
        profile:
          $ref: '#/components/schemas/Teacher'
        class_summary:
          type: object
          properties:
            total: { type: integer }
            active: { type: integer }
            upcoming: { type: integer }
            completed: { type: integer }
            total_students: { type: integer }
        schedule:
          type: object
          properties:
            today_sessions:
              type: array
              items: { type: object }
            upcoming_sessions:
              type: array
              items: { type: object }
            pending_attendance_count: { type: integer }
        assignments:
          type: object
          properties:
            active: { type: integer }
            draft: { type: integer }
            due_soon: { type: integer }
            pending_submissions: { type: integer }
        communication:
          $ref: '#/components/schemas/CommunicationSummary'
        as_of: { type: string, format: date-time }

    CreateTeacherRequest:
      type: object
      required: [fullName, email, password]
      properties:
        fullName: { type: string, minLength: 1 }
        email: { type: string, format: email }
        phone: { type: string }
        password:
          type: string
          minLength: 8
          description: Phải có chữ hoa, chữ thường, số và ký tự đặc biệt
        dateOfBirth: { type: string, format: date }
        gender:
          type: string
          enum: [male, female, other]
        teacherInfo:
          type: object
          properties:
            subjects:
              type: array
              items: { type: string }
            joinDate: { type: string, format: date }

    UpdateTeacherRequest:
      type: object
      properties:
        fullName: { type: string, minLength: 1 }
        phone: { type: string }
        dateOfBirth: { type: string, format: date }
        gender:
          type: string
          enum: [male, female, other]
        avatarUrl: { type: string, format: uri }
        teacherInfo:
          type: object
          properties:
            subjects:
              type: array
              items: { type: string }
            joinDate: { type: string, format: date }

    # ── Parent ───────────────────────────────────────────────────

    ParentStudentSummary:
      type: object
      properties:
        _id: { type: string }
        fullName: { type: string }
        userCode: { type: string }
        phone: { type: string }
        dateOfBirth: { type: string, format: date-time, nullable: true }
        gender:
          type: string
          enum: [male, female, other]
          nullable: true
        studentInfo:
          type: object
          properties:
            grade: { type: integer, nullable: true }
            schoolName: { type: string, nullable: true }

    ParentInfo:
      type: object
      properties:
        relationship:
          type: string
          enum: [father, mother, guardian, other]
          nullable: true
        studentIds:
          type: array
          items:
            oneOf:
              - type: string
              - $ref: '#/components/schemas/ParentStudentSummary'

    Parent:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            dateOfBirth: { type: string, format: date-time, nullable: true }
            gender:
              type: string
              enum: [male, female, other]
              nullable: true
            avatarUrl: { type: string, format: uri, nullable: true }
            parentInfo:
              $ref: '#/components/schemas/ParentInfo'

    ParentOverview:
      type: object
      properties:
        profile:
          $ref: '#/components/schemas/Parent'
        children:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ParentStudentSummary'
              - type: object
                properties:
                  attendance_last_30_days:
                    $ref: '#/components/schemas/AttendanceSummary'
        schedule:
          type: object
          properties:
            today_sessions:
              type: array
              items: { type: object }
            upcoming_sessions:
              type: array
              items: { type: object }
        assignments:
          type: object
          properties:
            active_visible:
              type: array
              items: { type: object }
        grades:
          type: object
          properties:
            latest_published:
              type: array
              items: { type: object }
        finance:
          $ref: '#/components/schemas/FinanceDueSummary'
        communication:
          $ref: '#/components/schemas/CommunicationSummary'
        as_of: { type: string, format: date-time }

    CreateParentRequest:
      type: object
      required: [fullName, phone]
      properties:
        fullName: { type: string, minLength: 1 }
        email:
          type: string
          format: email
          description: Có thể bỏ trống, hệ thống sẽ tự sinh email nội bộ
        phone: { type: string, minLength: 10 }
        password:
          type: string
          minLength: 8
          description: Nếu bỏ trống, hệ thống dùng mặc định `TempPass@123`
        dateOfBirth: { type: string, format: date }
        gender:
          type: string
          enum: [male, female, other]
        avatarUrl: { type: string, format: uri }
        isActive: { type: boolean }
        parentInfo:
          type: object
          properties:
            relationship:
              type: string
              enum: [father, mother, guardian, other]
            studentIds:
              type: array
              items: { type: string }

    UpdateParentRequest:
      type: object
      properties:
        fullName: { type: string, minLength: 1 }
        email: { type: string, format: email }
        phone: { type: string, minLength: 10 }
        dateOfBirth: { type: string, format: date }
        gender:
          type: string
          enum: [male, female, other]
        avatarUrl: { type: string, format: uri }
        isActive: { type: boolean }
        parentInfo:
          type: object
          properties:
            relationship:
              type: string
              enum: [father, mother, guardian, other]
            studentIds:
              type: array
              items: { type: string }

    # ── Student ───────────────────────────────────────────────────

    AttendanceSummary:
      type: object
      properties:
        total: { type: integer }
        present: { type: integer }
        absent: { type: integer }
        attendance_rate: { type: number, description: Tỷ lệ có mặt theo phần trăm }

    FinanceDueSummary:
      type: object
      properties:
        unpaid_invoices: { type: integer }
        unpaid_amount: { type: number }
        by_status:
          type: object
          additionalProperties:
            type: object
            properties:
              count: { type: integer }
              amount: { type: number }

    CommunicationSummary:
      type: object
      properties:
        unread_notifications: { type: integer }
        unread_messages: { type: integer }

    StudentOverview:
      type: object
      properties:
        profile:
          $ref: '#/components/schemas/User'
        classes:
          type: object
          properties:
            total_active: { type: integer }
            items:
              type: array
              items: { type: object }
        schedule:
          type: object
          properties:
            today_sessions:
              type: array
              items: { type: object }
            upcoming_sessions:
              type: array
              items: { type: object }
        attendance:
          allOf:
            - $ref: '#/components/schemas/AttendanceSummary'
            - type: object
              properties:
                last_30_days_total: { type: integer }
        assignments:
          type: object
          properties:
            active:
              type: array
              items: { type: object }
            submission_by_status:
              type: object
              additionalProperties: { type: integer }
        grades:
          type: object
          properties:
            latest_published:
              type: array
              items: { type: object }
        finance:
          $ref: '#/components/schemas/FinanceDueSummary'
        communication:
          $ref: '#/components/schemas/CommunicationSummary'
        as_of: { type: string, format: date-time }

    CreateStudentRequest:
      type: object
      required: [full_name]
      properties:
        full_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        date_of_birth: { type: string, format: date }
        parent_ids:
          type: array
          items: { type: string }

    UpdateStudentRequest:
      type: object
      properties:
        full_name: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        date_of_birth: { type: string, format: date }

    # ── Class ─────────────────────────────────────────────────────

    Class:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        code: { type: string }
        branchId: { type: string }
        teacherId: { type: string }
        subjectName: { type: string }
        status: { type: string, enum: [active, closed] }
        studentCount: { type: integer }
        maxStudents: { type: integer }
        schedule: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        tuitionFee: { type: number }
        createdAt: { type: string, format: date-time }

    CreateClassRequest:
      type: object
      required: [name, teacher_id, subject_name, tuition_fee]
      properties:
        name: { type: string }
        teacher_id: { type: string }
        subject_name: { type: string }
        max_students: { type: integer }
        schedule: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        tuition_fee: { type: number, minimum: 0 }

    UpdateClassRequest:
      type: object
      properties:
        name: { type: string }
        teacher_id: { type: string }
        subject_name: { type: string }
        max_students: { type: integer }
        schedule: { type: string }
        tuition_fee: { type: number, minimum: 0 }

    # ── Enrollment ────────────────────────────────────────────────

    ClassStudentItem:
      type: object
      description: Enrollment record với studentId được populate
      properties:
        _id: { type: string, description: Enrollment ID }
        enrolledAt: { type: string, format: date-time, description: Ngày tham gia }
        leftAt: { type: string, format: date-time, nullable: true }
        leftReason: { type: string, nullable: true }
        studentId:
          type: object
          description: Thông tin học sinh
          properties:
            _id: { type: string }
            fullName: { type: string, description: Họ tên học sinh }
            userCode: { type: string, description: Mã học sinh }
            phone: { type: string, nullable: true, description: Số điện thoại liên hệ }
            email: { type: string, format: email, description: Email liên hệ }
            dateOfBirth: { type: string, format: date, nullable: true }

    Enrollment:
      type: object
      properties:
        _id: { type: string }
        studentId: { type: string }
        classId: { type: string }
        branchId: { type: string }
        status: { type: string, enum: [active, left, completed] }
        enrolledAt: { type: string, format: date-time }
        leftAt: { type: string, format: date-time, nullable: true }
        reason: { type: string, nullable: true }

    # ── ClassSession ──────────────────────────────────────────────

    ClassSession:
      type: object
      properties:
        _id: { type: string }
        classId: { type: string }
        branchId: { type: string }
        teacherId: { type: string }
        sessionDate: { type: string, format: date-time }
        startTime: { type: string, example: "08:00" }
        endTime: { type: string, example: "10:00" }
        topic: { type: string, nullable: true }
        status:
          type: string
          enum: [scheduled, ongoing, completed, cancelled]
        attendanceStatus:
          type: string
          enum: [pending, submitted]
        createdAt: { type: string, format: date-time }

    CreateSessionRequest:
      type: object
      required: [session_date, start_time, end_time]
      properties:
        session_date: { type: string, format: date }
        start_time: { type: string, example: "08:00" }
        end_time: { type: string, example: "10:00" }
        topic: { type: string }

    UpdateSessionRequest:
      type: object
      properties:
        sessionDate: { type: string, format: date }
        startTime: { type: string, example: "08:00" }
        endTime: { type: string, example: "10:00" }
        roomCode: { type: string }
        sessionType: { type: string, enum: [regular, extra, makeup, cancelled] }
        status: { type: string, enum: [scheduled, completed, cancelled] }
        teacherId: { type: string }
        note: { type: string }
        onlineMeetingUrl: { type: string, format: uri }

    # ── Attendance ────────────────────────────────────────────────

    Attendance:
      type: object
      properties:
        _id: { type: string }
        sessionId: { type: string }
        studentId: { type: string }
        classId: { type: string }
        branchId: { type: string }
        sessionDate: { type: string, format: date-time }
        status:
          type: string
          enum: [present, absent, late, excused]
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    # ── Assignment ────────────────────────────────────────────────

    Assignment:
      type: object
      properties:
        _id: { type: string }
        classId: { type: string }
        teacherId: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        dueDate: { type: string, format: date-time, nullable: true }
        maxScore: { type: number }
        submissionConfig:
          type: object
          properties:
            allowText: { type: boolean }
            allowFile: { type: boolean }
            allowLate: { type: boolean }
        status: { type: string, enum: [draft, published, closed] }
        createdAt: { type: string, format: date-time }

    CreateAssignmentRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        due_date: { type: string, format: date-time }
        max_score: { type: number, default: 10 }
        submission_config:
          type: object
          properties:
            allow_text: { type: boolean, default: true }
            allow_file: { type: boolean, default: false }
            allow_late: { type: boolean, default: false }

    Submission:
      type: object
      properties:
        _id: { type: string }
        assignmentId: { type: string }
        studentId: { type: string }
        content: { type: string, nullable: true }
        attachmentUrls:
          type: array
          items: { type: string }
        submittedAt: { type: string, format: date-time }
        score: { type: number, nullable: true }
        feedback: { type: string, nullable: true }
        gradedAt: { type: string, format: date-time, nullable: true }
        gradedBy: { type: string, nullable: true }

    # ── GradeRecord ───────────────────────────────────────────────

    GradeRecord:
      type: object
      properties:
        _id: { type: string }
        studentId: { type: string }
        classId: { type: string }
        teacherId: { type: string }
        branchId: { type: string }
        academicPeriod: { type: string, example: "2025-K1" }
        assignmentAvg: { type: number, nullable: true }
        examScores:
          type: array
          items:
            type: object
            properties:
              examName: { type: string }
              score: { type: number }
              weight: { type: number }
        finalScore: { type: number, nullable: true }
        teacherComment: { type: string, nullable: true }
        status: { type: string, enum: [draft, published] }
        publishedAt: { type: string, format: date-time, nullable: true }

    UpsertGradeRecordRequest:
      type: object
      required: [student_id, class_id, academic_period]
      properties:
        student_id: { type: string }
        class_id: { type: string }
        academic_period: { type: string, example: "2025-K1" }
        exam_scores:
          type: array
          items:
            type: object
            required: [exam_name, score, weight]
            properties:
              exam_name: { type: string }
              score: { type: number, minimum: 0, maximum: 10 }
              weight: { type: number, minimum: 0, maximum: 1 }
        teacher_comment: { type: string }

    # ── Finance ───────────────────────────────────────────────────

    Invoice:
      type: object
      properties:
        _id: { type: string }
        invoiceCode: { type: string }
        branchId: { type: string }
        studentId: { type: string }
        classId: { type: string }
        billingPeriod: { type: string, example: "2025-01" }
        totalAmount: { type: number }
        status:
          type: string
          enum: [unpaid, paid, overdue, cancelled]
        paidAt: { type: string, format: date-time, nullable: true }
        paymentMethod:
          type: string
          enum: [cash, vnpay]
          nullable: true
        vnpayTransactionRef: { type: string, nullable: true }
        classSnapshot:
          type: object
          properties:
            subjectName: { type: string }
            tuitionFee: { type: number }
        createdAt: { type: string, format: date-time }

    CreateInvoiceRequest:
      type: object
      required: [student_id, class_id, billing_period, total_amount]
      properties:
        student_id: { type: string }
        class_id: { type: string }
        billing_period: { type: string, example: "2025-01" }
        total_amount: { type: number, minimum: 0 }

    # ── Notification ──────────────────────────────────────────────

    Notification:
      type: object
      properties:
        _id: { type: string }
        userId: { type: string }
        branchId: { type: string }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        isRead: { type: boolean }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    # ── Message ───────────────────────────────────────────────────

    Thread:
      type: object
      properties:
        threadId: { type: string }
        lastContent: { type: string }
        lastSentAt: { type: string, format: date-time }
        unreadCount: { type: integer }
        otherUser:
          type: object
          properties:
            _id: { type: string }
            fullName: { type: string }
            role: { type: string }

    Message:
      type: object
      properties:
        _id: { type: string }
        threadId: { type: string }
        senderId: { type: string }
        receiverId: { type: string }
        content: { type: string }
        isRead: { type: boolean }
        sentAt: { type: string, format: date-time }

    # ── ClassAnnouncement ─────────────────────────────────────────

    ClassAnnouncement:
      type: object
      properties:
        _id: { type: string }
        branchId: { type: string }
        classId: { type: string }
        authorId: { type: string }
        title: { type: string }
        content: { type: string, nullable: true }
        attachmentUrls:
          type: array
          items: { type: string }
        isPinned: { type: boolean }
        targetAudience:
          type: array
          items:
            type: string
            enum: [student, parent]
        createdAt: { type: string, format: date-time }

    CreateAnnouncementRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        content: { type: string }
        attachment_urls:
          type: array
          items: { type: string }
        is_pinned: { type: boolean, default: false }
        target_audience:
          type: array
          items:
            type: string
            enum: [student, parent]
          default: [student, parent]

  responses:
    UnauthorizedError:
      description: Chưa đăng nhập hoặc Token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ForbiddenError:
      description: Không có quyền truy cập
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFoundError:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ConflictError:
      description: Dữ liệu đã tồn tại hoặc xung đột trạng thái
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ValidationError:
      description: Dữ liệu gửi lên không đúng định dạng
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
